version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ravi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raavi_db}
      POSTGRES_USER: ${POSTGRES_USER:-raavi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raavi_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-raavi_user} -d ${POSTGRES_DB:-raavi_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_network]

  redis:
    image: redis:7-alpine
    container_name: ravi_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app_network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ravi_backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-raavi_user}:${POSTGRES_PASSWORD:-raavi_pass}@postgres:5432/${POSTGRES_DB:-raavi_db}
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8001
      BOT_SERVICE_URL: http://telegram-bot:8080
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-n8n_secret_123456}
      BOT_WEBHOOK_SHARED_SECRET: ${BOT_WEBHOOK_SHARED_SECRET:-bot_secret_123456}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai-engine: { condition: service_healthy }
      telegram-bot: { condition: service_started }
    expose: ['4000']
    networks: [app_network]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: ravi_ai_engine
    expose: ['8001']
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8001/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app_network]

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: ravi_telegram_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-change-me}
      BOT_WEBHOOK_PATH: /webhook/telegram
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-telegram_secret_123456}
      BOT_PUBLIC_WEBHOOK_URL: ${BOT_PUBLIC_WEBHOOK_URL:-https://example.com/bot/webhook/telegram}
      BOT_WEBHOOK_SHARED_SECRET: ${BOT_WEBHOOK_SHARED_SECRET:-bot_secret_123456}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    expose: ['8080']
    networks: [app_network]

  n8n:
    image: n8nio/n8n:1.79.3
    container_name: ravi_n8n
    environment:
      N8N_HOST: n8n.local
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-n8n_secret_123456}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-raavi_db}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-raavi_user}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-raavi_pass}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    networks: [app_network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ravi_frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:4000/api
    depends_on:
      backend: { condition: service_healthy }
    expose: ['3000']
    networks: [app_network]

  nginx:
    image: nginx:1.27-alpine
    container_name: ravi_nginx
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_started }
      n8n: { condition: service_started }
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks: [app_network]

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  nginx_logs:

networks:
  app_network:
    driver: bridge
