version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: raavi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: raavi_pass_2024
      POSTGRES_DB: raavi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - raavi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raavi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - raavi_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raavi_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - raavi_network

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: raavi_telegram_bot
    env_file:
      - ./telegram-bot/.env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - backend
    networks:
      - raavi_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raavi_frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - raavi_network

volumes:
  postgres_data:
  redis_data:

networks:
  raavi_network:
    driver: bridge
