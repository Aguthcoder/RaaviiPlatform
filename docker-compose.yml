version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raavi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Q1FpBFqEwbrfFK4uVHQbDf7V3h6XaOiY}
      POSTGRES_DB: ${POSTGRES_DB:-raavi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-raavi_user} -d ${POSTGRES_DB:-raavi_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-raavi_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-Q1FpBFqEwbrfFK4uVHQbDf7V3h6XaOiY}
      DB_DATABASE: ${POSTGRES_DB:-raavi_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      ENABLE_DEV_OTP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
